name: DENUEL CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: denuel-rental-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: denuel-rental-main/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        env:
          DATABASE_URL: mysql://user:password@127.0.0.1:3306/denuel_ci
          JWT_SECRET: ci-only-secret-not-for-production
          NEXT_PUBLIC_MAPBOX_TOKEN: pk.ci-placeholder
        run: npm run build
